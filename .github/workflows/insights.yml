name: insights
on:
  workflow_dispatch:
  schedule:
    - cron: "40 20 * * *"      # 02:10 IST daily
permissions:
  contents: write
env:
  BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
  BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
  DISTRICT_BRIDGE_URL: ${{ secrets.DISTRICT_BRIDGE_URL }}   # owner 14 Nov: the one minnal-bot token lives in the Minnal bridge
  DISTRICT_BRIDGE_KEY: ${{ secrets.DISTRICT_BRIDGE_KEY }}
  IG_SYSTEM_TOKEN: ${{ secrets.IG_SYSTEM_TOKEN }}      # owner 16 Nov: minnal-bot token with the insights permission (empty = the bridge's token)
jobs:
  insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pillow
      - run: python poster/insights.py
      - name: Reference page insights (owner 16 Nov - learn from both pages every night)
        run: python research_free/reference_sync.py
      - name: Commit learned data
        run: |
          git config user.name "kovaiminnal-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f poster/insights research_free/learned.json research_free/reference_reach.json
          git commit -m "insights: learned data update" || echo none
          git pull --rebase --autostash origin main
          git push
